name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag v<version>) from this commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build exe (PyInstaller)
        run: pyinstaller wincam.spec --noconfirm --clean

      - name: Check bundle
        shell: pwsh
        run: |
          $root = "dist/WinCam"
          if (-not (Test-Path "$root/WinCam.exe")) { throw "WinCam.exe missing" }
          $ff = Get-ChildItem -Recurse $root -Filter "avcodec-*.dll"
          $plugin = Get-ChildItem -Recurse $root -Filter "*mediaplugin.dll"
          if (-not $ff) { throw "FFmpeg DLLs missing from bundle" }
          if (-not $plugin) { throw "Qt multimedia plugin missing from bundle" }
          $plugin | ForEach-Object { Write-Host "plugin: $($_.FullName)" }

      - name: Self-test frozen exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist/WinCam/WinCam.exe" -ArgumentList "--selftest", "`"$out`"", "--require-network" -Wait -PassThru
          if (-not (Test-Path $out)) { throw "self-test produced no report" }
          Get-Content $out
          "### Self-test`n``````json`n$(Get-Content $out -Raw)`n``````" >> $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Check exe icon
        run: |
          python -c "import pefile; pe = pefile.PE('dist/WinCam/WinCam.exe'); ids = [e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries]; print('resource types:', ids); assert 14 in ids, 'no RT_GROUP_ICON in WinCam.exe'"

      - name: UI smoke test (screenshots)
        continue-on-error: true
        shell: pwsh
        run: |
          pip install pillow --quiet
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W { [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c); }
          "@
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path); $g.Dispose(); $bmp.Dispose()
          }
          $p = Start-Process -FilePath "dist/WinCam/WinCam.exe" -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          Write-Host "window: '$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
          $dir = Join-Path $env:RUNNER_TEMP "screens"; New-Item -ItemType Directory $dir | Out-Null
          Shot "$dir/1-running.png"
          [W]::ShowWindow($p.MainWindowHandle, 6) | Out-Null   # SW_MINIMIZE -> should show a notification
          Start-Sleep -Seconds 3
          Shot "$dir/2-minimized.png"
          Stop-Process -Id $p.Id -Force
          python tools/ci_screens.py "$dir/1-running.png" "$dir/2-minimized.png"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path wincam/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WinCam -DestinationPath "dist/WinCam-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer/wincam.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: WinCam-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/WinCam-*-Setup.exe
            dist/WinCam-*-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: WinCam ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/WinCam-*-Setup.exe
            dist/WinCam-*-portable.zip
