name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build exe (PyInstaller)
        run: pyinstaller wincam.spec --noconfirm --clean

      - name: Check bundle
        shell: pwsh
        run: |
          $root = "dist/WinCam"
          if (-not (Test-Path "$root/WinCam.exe")) { throw "WinCam.exe missing" }
          $ff = Get-ChildItem -Recurse $root -Filter "avcodec-*.dll"
          $plugin = Get-ChildItem -Recurse $root -Filter "*mediaplugin.dll"
          if (-not $ff) { throw "FFmpeg DLLs missing from bundle" }
          if (-not $plugin) { throw "Qt multimedia plugin missing from bundle" }
          $plugin | ForEach-Object { Write-Host "plugin: $($_.FullName)" }

      - name: Self-test frozen exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist/WinCam/WinCam.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { throw "self-test produced no report" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path wincam/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WinCam -DestinationPath "dist/WinCam-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/wincam.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: WinCam-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/WinCam-*-Setup.exe
            dist/WinCam-*-portable.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinCam-*-Setup.exe
            dist/WinCam-*-portable.zip
